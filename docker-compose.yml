services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_PATH=/app/server/data/incidents.sqlite
    command: npm run dev
    stdin_open: true
    tty: true
